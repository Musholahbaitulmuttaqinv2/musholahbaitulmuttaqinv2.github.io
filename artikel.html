<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Artikel</title>
</head>

<body>

<h1 id="judul"></h1>

<div id="isi"></div>

<script>

const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

const urlSheet = "https://opensheet.elk.sh/19SptDdrmjtjeHPQWqPUJacb6LpnpiJ1ZC6nyQ1BQmOE/Beranda";

fetch(urlSheet)
.then(res => res.json())
.then(data => {

const artikel = data.find(item => item.slug === slug);

document.getElementById("judul").innerText = artikel.judul;
document.getElementById("isi").innerHTML = artikel.isi;

});

</script>

</body>
</html>
